# ============================================================
#  JoeVPN  -  config.conf
#  所有可配置参数。首次安装：凭据留空 -> 脚本自动生成并写回本文件。
#  换 VPS 想复用同一套节点：把生成好的凭据留着即可。
# ============================================================

# ---------------- 端口 ----------------
REALITY_PORT=443           # VLESS Reality (TCP)
HY2_PORT=8443              # Hysteria2 (UDP)
ANYTLS_PORT=8443           # AnyTLS (TCP) —— 和 Hy2 同号不冲突：一个 TCP 一个 UDP

# ---------------- Reality ----------------
# 偷跑目标站：必须真实存在、支持 TLS1.3、且平时你不会访问。
# www.cloudflare.com 被用烂了，建议换成不常见的干净站点（如某企业官网）。
REALITY_SNI="www.cloudflare.com"
REALITY_HANDSHAKE_SERVER="www.cloudflare.com"
REALITY_HANDSHAKE_PORT=443

# ---------------- Hysteria2 ----------------
HY2_SNI="vpn.joe"          # 自签证书的域名，随便填；客户端需 insecure=1

# ---------------- AnyTLS ----------------
# 复用 Hy2 的自签证书，不需要域名；客户端跳过证书验证（订阅里已自动设好）。
ENABLE_ANYTLS=1            # 1=启用 AnyTLS 节点（需 sing-box ≥ 1.12，脚本会自动检查）
ANYTLS_SNI=""              # 留空=沿用 HY2_SNI

# ---------------- 流媒体 DNS 解锁（v1.4 新增）----------------
# 原生 IP 解锁不了 Netflix / Disney+ 时，买付费 DNS 解锁（如 nfdns），把它给的
# DNS 服务器 IP 填到 UNLOCK_IP。留空 = 不启用（和 v1.3 行为完全一样）。
# 前提：先在解锁商家后台把【本 VPS 的公网 IPv4】加进白名单。
# 只有下面列出的域名交给解锁 DNS 解析，其余流量照旧走 Google/Cloudflare。
UNLOCK_IP=""               # 例：UNLOCK_IP="103.x.x.x"
UNLOCK_PORT=53             # 商家没特别说明就是 53
# 交给解锁 DNS 的域名（空格分隔，后缀匹配：netflix.com 也包括 www.netflix.com）。
# ⚠ 不要加 nflxvideo.net（Netflix 视频流），否则视频会绕到解锁商的服务器上，限速。
# 商家给了自己的域名列表就以商家为准；想多解锁 Prime Video / TVB 等，把它们的域名追加进来。
UNLOCK_DOMAINS="netflix.com netflix.net nflximg.com nflximg.net nflxext.com nflxso.net disneyplus.com disney-plus.net disneystreaming.com bamgrid.com"

# ---------------- 凭据（留空=自动生成，首次务必留空）----------------
UUID=""
REALITY_PRIVATE_KEY=""
REALITY_PUBLIC_KEY=""
REALITY_SHORT_ID=""
HY2_PASSWORD=""
ANYTLS_PASSWORD=""

# ---------------- 带宽模式 ----------------
# adaptive : 服务端 ignore_client_bandwidth + BBR 自适应（推荐，流媒体最稳）
# fixed    : 固定带宽（需设置下面两个值，仅在明确知道链路上限时用）
HY2_BANDWIDTH_MODE="adaptive"
HY2_UP_MBPS=30
HY2_DOWN_MBPS=100

# ---------------- 客户端 ----------------
CLIENT_NAME="JoeVPN"       # 节点名前缀

# ---------------- 自托管订阅服务 ----------------
ENABLE_SUB_SERVER=1        # 1=安装完自动起订阅服务并出链接+二维码
SUB_PORT=6060              # 订阅服务端口（Lightsail/AWS 要同步控制台防火墙）
SUB_TOKEN=""               # 随机路径，留空自动生成并写回；换 VPS 保留可复用同一链接路径

# ---------------- 系统优化开关 ----------------
ENABLE_BBR=1               # 开 BBR 拥塞控制
ENABLE_IP_FORWARD=1        # 开 IPv4/IPv6 转发
ENABLE_NET_TUNE=1          # QUIC/TCP 缓冲区、流媒体长连接优化
ENABLE_MEM_TUNE=1          # 按内存自适应（小内存自动建 swap）

# ---------------- 本机测试入口（v1.4 新增）----------------
# 只监听 127.0.0.1 的 SOCKS5/HTTP 端口，外网连不上。unlock-check.sh 用它
# 「站在 sing-box 里面」测解锁，结果和客户端看到的一致。0 = 不开。
LOCAL_TEST_PORT=10808

# ---------------- sing-box 版本 ----------------
# 留空=每次装最新稳定版。若哪天新版改了配置格式导致启动失败，
# 在这里填一个确认能用的版本号（如 1.12.0）重跑即可。
SB_VERSION=""

# ---------------- 路径（一般不用改）----------------
SB_CONFIG_DIR="/etc/sing-box"
SB_CERT_DIR="/etc/sing-box/certs"
SB_DATA_DIR="/var/lib/sing-box"
SB_BIN="/usr/bin/sing-box"
